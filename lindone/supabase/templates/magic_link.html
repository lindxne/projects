<!doctype html>
<html lang="ru">
  <body style="margin:0;padding:32px 16px;background:#07060d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f4f2ff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="420" cellpadding="0" cellspacing="0" style="max-width:420px;background:#14121f;border:1px solid #2c2942;border-radius:24px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 4px;font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:#a8a3c7;">Lindone</p>
                <h1 style="margin:0 0 20px;font-size:22px;font-weight:600;color:#ffffff;">Вход в архив</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#d6d2ee;">Нажми кнопку, чтобы войти. Ссылка одноразовая и действует один час.</p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:14px 28px;border-radius:999px;background:#ffffff;color:#0b0a14;font-size:15px;font-weight:600;text-decoration:none;">Войти в Lindone</a>
                </p>
                <p style="margin:0 0 8px;font-size:13px;color:#a8a3c7;">Или введи код на странице входа (удобно в установленном приложении):</p>
                <p style="margin:0;font-size:30px;font-weight:700;letter-spacing:0.3em;color:#ffffff;">{{ .Token }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
