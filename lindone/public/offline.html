<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a14" />
    <title>Lindone — нет сети</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 20%, #2a1a66, transparent 55%), radial-gradient(circle at 80% 80%, #142a66, transparent 55%), #0b0a14;
        color: #f4f2ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(13, 11, 26, 0.6);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #c9c5e0; line-height: 1.5; }
      button {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #0b0a14;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет соединения</h1>
      <p>Архив живёт в облаке. Подключись к сети — и всё вернётся на место.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
